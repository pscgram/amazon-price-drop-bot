name: Price Bot Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python files
        run: |
          python -m py_compile bot.py
          python -m py_compile providers/price_provider.py
          python -m py_compile telegram/notifier.py

      - name: Test imports
        env:
          BOT_TOKEN: test
          CHANNEL_ID: test
        run: |
          python -c "from providers.price_provider import PriceProvider"
          python -c "from telegram.notifier import TelegramNotifier"

      - name: Test completed
        run: echo "✅ All Python files passed the test!"
